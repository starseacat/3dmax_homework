<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作业图片上传</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:#e8f0ff;line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(900px 600px at 10% -10%,#1b3c7a 0%,transparent 60%),
             linear-gradient(180deg,#060f24,#0a1a3d 50%,#07132c);
  background-attachment:fixed;
}
.wrap{max-width:720px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:24px;margin:0 0 8px;color:#dce9ff;letter-spacing:.03em}
.sub{margin:0 0 28px;font-size:13.5px;color:#9db4dd}
.card{
  margin-bottom:18px;padding:22px 24px;
  background:linear-gradient(180deg,rgba(24,48,98,.8),rgba(11,25,56,.88));
  border:1px solid rgba(125,170,255,.18);
  border-radius:18px;
  box-shadow:0 18px 40px rgba(0,8,30,.4);
}
.card h2{margin:0 0 14px;font-size:15px;color:#cfe0ff;letter-spacing:.05em;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label{display:block;font-size:12.5px;color:#9db4dd}
input,select{
  width:100%;margin-top:6px;padding:9px 12px;
  font-size:14px;color:#e8f0ff;font-family:inherit;
  background:rgba(8,20,44,.85);
  border:1px solid rgba(125,170,255,.25);
  border-radius:10px;outline:none;
}
input:focus,select:focus{border-color:rgba(140,190,255,.6)}
.hint{margin:10px 0 0;font-size:12px;color:#8399bf}
.pick{
  margin-top:4px;padding:26px 18px;text-align:center;cursor:pointer;
  border:1px dashed rgba(125,180,255,.4);border-radius:14px;
  background:rgba(60,110,200,.10);
  font-size:13.5px;color:#a8c6f5;
}
.pick.over{background:rgba(80,140,255,.22);border-color:rgba(150,200,255,.7)}
.pick input{display:none}
ul{list-style:none;margin:14px 0 0;padding:0}
li{
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;margin-bottom:8px;
  background:rgba(10,24,52,.6);border-radius:10px;
  font-size:13px;color:#c6d6f2;
}
li img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:0 0 44px}
li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .size{color:#8fa6cd;font-size:12px;flex:0 0 auto}
li .st{font-size:12px;flex:0 0 auto}
.ok{color:#7ee0a8}
.err{color:#ff9b9b}
button{
  width:100%;margin-top:6px;padding:13px;
  font-size:15px;font-weight:600;letter-spacing:.04em;
  color:#04122c;cursor:pointer;
  background:linear-gradient(135deg,#5b9bff,#9ad0ff);
  border:none;border-radius:12px;
}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{margin:14px 0 0;font-size:13px;color:#a8c6f5;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛰️ 作业图片上传</h1>
  <p class="sub">传完等 1 分钟，图片会自动出现在网站对应步骤下面</p>

  <section class="card">
    <h2>1 · 仓库与授权</h2>
    <div class="row">
      <label>仓库（owner/repo）<input id="repo" placeholder="starsecat/3dmax_homework"></label>
      <label>分支<input id="branch" placeholder="main"></label>
    </div>
    <label style="margin-top:12px;display:block">GitHub Token
      <input id="token" type="password" placeholder="github_pat_...">
    </label>
    <p class="hint">Token 只存在你本机浏览器里，不会写进任何文件。这个页面别截图或分享给别人。</p>
  </section>

  <section class="card">
    <h2>2 · 图片放哪里</h2>
    <div class="row3">
      <label>作业
        <select id="work">
          <option value="computer-set">电脑三件套</option>
          <option value="cartoon-house">卡通小房子</option>
          <option value="sofa">沙发</option>
        </select>
      </label>
      <label>类型
        <select id="kind">
          <option value="step">搭建步骤图</option>
          <option value="log">问题记录图</option>
        </select>
      </label>
      <label>第几个
        <select id="idx"></select>
      </label>
    </div>
    <p class="hint" id="path"></p>
  </section>

  <section class="card">
    <h2>3 · 选图片（可多选，自动压成 jpg）</h2>
    <label class="pick" id="pick">
      点击选择，或把图片拖到这里
      <input id="file" type="file" accept="image/*" multiple>
    </label>
    <ul id="list"></ul>
  </section>

  <button id="btn">开始上传</button>
  <p id="msg"></p>
</div>

<script>
const $ = s => document.querySelector(s);
const repoEl = $('#repo'), branchEl = $('#branch'), tokenEl = $('#token');
const workEl = $('#work'), kindEl = $('#kind'), idxEl = $('#idx');
const pickEl = $('#pick'), fileEl = $('#file'), listEl = $('#list');
const btn = $('#btn'), msg = $('#msg'), pathEl = $('#path');

let queue = [];

/* 记住上次填的内容 */
repoEl.value   = localStorage.getItem('up_repo')   || 'starsecat/3dmax_homework';
branchEl.value = localStorage.getItem('up_branch') || 'main';
tokenEl.value  = localStorage.getItem('up_token')  || '';
repoEl.oninput   = () => localStorage.setItem('up_repo', repoEl.value.trim());
branchEl.oninput = () => localStorage.setItem('up_branch', branchEl.value.trim());
tokenEl.oninput  = () => localStorage.setItem('up_token', tokenEl.value.trim());

for (let i = 1; i <= 6; i++){
  const o = document.createElement('option');
  o.value = o.textContent = i;
  idxEl.appendChild(o);
}

/* 路径 */
function baseName(){
  const n = idxEl.value;
  return kindEl.value === 'step' ? n : 'log' + n;
}
function nameFor(i){
  return i === 0 ? baseName() + '.jpg' : baseName() + '-' + (i + 1) + '.jpg';
}
function dir(){ return 'assets/img/' + workEl.value; }

function preview(){
  const n = idxEl.value;
  pathEl.textContent = '保存为：' + dir() + '/' + baseName() + '.jpg'
    + (kindEl.value === 'step'
        ? '（网站第 ' + n + ' 步下面）'
        : '（网站第 ' + n + ' 条问题记录下面）');
}
workEl.onchange = kindEl.onchange = idxEl.onchange = () => { preview(); rebuildPaths(); };
preview();

/* 压缩 */
async function compress(file, maxSide = 1600, quality = 0.82){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale);
  const h = Math.round(bmp.height * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
}

/* 选文件 */
async function addFiles(files){
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  btn.disabled = true;

  for (const f of imgs){
    const item = { file: f, blob: null, url: '', path: '', state: '压缩中…' };
    queue.push(item);
    render();
    try{
      item.blob = await compress(f);
      item.url  = URL.createObjectURL(item.blob);
      item.state = '待上传';
    }catch (e){
      item.state = '压缩失败（请转成 jpg/png）';
    }
  }

  rebuildPaths();
  btn.disabled = false;
}

fileEl.onchange = e => addFiles(e.target.files);

['dragenter','dragover'].forEach(t => pickEl.addEventListener(t, e => {
  e.preventDefault(); pickEl.classList.add('over');
}));
['dragleave','drop'].forEach(t => pickEl.addEventListener(t, e => {
  e.preventDefault(); pickEl.classList.remove('over');
}));
pickEl.addEventListener('drop', e => addFiles(e.dataTransfer.files));

function rebuildPaths(){
  queue.forEach((it, i) => it.path = dir() + '/' + nameFor(i));
  render();
}

function render(){
  listEl.innerHTML = queue.map(it => `
    <li>
      ${it.url ? `<img src="${it.url}" alt="">` : ''}
      <span class="name">${it.path || it.file.name}</span>
      <span class="size">${Math.round((it.blob || it.file).size / 1024)} KB</span>
      <span class="st ${it.state === '完成' ? 'ok' : (it.state.includes('失败') ? 'err' : '')}">${it.state}</span>
    </li>`).join('');
}

/* 上传到 GitHub */
function b64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

async function put(path, blob, token, repo, branch){
  const api = 'https://api.github.com/repos/' + repo + '/contents/' + path;
  const headers = {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };

  let sha = null;
  const head = await fetch(api + '?ref=' + branch, { headers });
  if (head.ok){
    sha = (await head.json()).sha;
  } else if (head.status !== 404){
    throw new Error('读取失败 HTTP ' + head.status);
  }

  const body = { message: '上传图片：' + path, content: await b64(blob), branch };
  if (sha) body.sha = sha;

  const res = await fetch(api, {
    method: 'PUT',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!res.ok){
    const t = await res.text();
    throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 160));
  }
}

btn.onclick = async () => {
  const token  = tokenEl.value.trim();
  const repo   = repoEl.value.trim();
  const branch = branchEl.value.trim() || 'main';

  if (!token) return msg.textContent = '请先填 GitHub Token';
  if (!repo.includes('/')) return msg.textContent = '仓库要写成 owner/repo';

  const todo = queue.filter(it => it.blob && it.state !== '完成');
  if (!todo.length) return msg.textContent = '还没有可上传的图片';

  btn.disabled = true;
  msg.textContent = '';

  for (const it of todo){
    it.state = '上传中…';
    render();
    try{
      await put(it.path, it.blob, token, repo, branch);
      it.state = '完成';
    }catch (e){
      it.state = '失败';
      msg.textContent = it.path + ' 上传失败：' + e.message;
    }
    render();
  }

  btn.disabled = false;
  const ok = queue.filter(it => it.state === '完成').length;
  const [owner, name] = repo.split('/');
  msg.textContent = `完成 ${ok} 张。等 1 分钟刷新网站：\nhttps://${owner}.github.io/${name}/#/${workEl.value}`;
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D 作业展示 · 沙发 / 柜子</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="panel brand">
    <h1>3D 建模作业</h1>
    <p>3ds Max 2025 · 沙发 / 柜子</p>
  </header>

  <nav class="panel models">
    <button class="model-btn active" data-model="cabinet"><span class="dot"></span>柜子</button>
    <button class="model-btn" data-model="sofa"><span class="dot"></span>沙发</button>
  </nav>

  <section class="panel toolbar">
    <div class="group">
      <span class="label">显示</span>
      <button class="chip active" data-display="shaded">着色</button>
      <button class="chip" data-display="wireframe">线框</button>
      <button class="chip" data-display="shadedWire">着色+线框</button>
      <button class="chip" data-display="clay">白模</button>
      <button class="chip" data-display="normal">法线</button>
    </div>
    <div class="group">
      <span class="label">相机</span>
      <button class="chip active" data-camera="persp">透视</button>
      <button class="chip" data-camera="ortho">正交</button>
    </div>
    <div class="group">
      <button class="chip active" id="btnGrid">网格</button>
      <button class="chip" id="btnRotate">自动旋转</button>
      <button class="chip" id="btnReset">重置视角</button>
      <button class="chip" id="btnFull">全屏</button>
    </div>
  </section>

  <aside class="panel info">
    <div class="info-name" id="infoName">柜子</div>
    <div class="info-note" id="infoNote">—</div>
    <div class="info-size" id="infoSize">—</div>
  </aside>

  <div class="hint">左键旋转 · 滚轮缩放 · 右键平移 · 按 1 / 2 切换模型</div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>模型加载中 <span id="loadPct">0%</span></p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>

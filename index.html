<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三维建模作业</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app"><div class="loading">加载中…</div></div>
<div id="lightbox"><img alt=""></div>

<script>
const app      = document.getElementById('app');
const lightbox = document.getElementById('lightbox');

const site  = { name: '', studentId: '', className: '', footer: '' };
let   works = [];

/* ---------- 小工具 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

const imgList = v => Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);

function shots(list){
  const imgs = imgList(list);
  if (!imgs.length) return '';
  return `<div class="shots">${imgs.map(src =>
    `<img src="${esc(src)}" alt="" loading="lazy">`).join('')}</div>`;
}

/* ---------- 首页 ---------- */
function renderHome(){
  document.title = `${site.name} · 三维建模作业`;

  const cards = works.map(w => `
    <a class="card" href="#/${esc(w.id)}">
      <div class="card-icon">${esc(w.icon) || '📦'}</div>
      <h2 class="card-title">${esc(w.title)}</h2>
      <div class="card-line"></div>
      <p class="card-desc">${esc(w.desc)}</p>
    </a>`).join('');

  app.innerHTML = `
  <div class="home">
    <header class="home-head">
      <h1 class="home-title">✦ 欢迎来到${esc(site.name)}的个人网站 ✦</h1>
      <p class="home-meta">姓名：${esc(site.name)} · 学号：${esc(site.studentId)} · ${esc(site.className)}</p>
    </header>

    <div class="cards">${cards || '<p class="empty">还没有作业，去后台添加吧</p>'}</div>

    <footer class="footer">${esc(site.footer)}</footer>
  </div>`;
}

/* ---------- 作业详情 ---------- */
function renderWork(w){
  document.title = `${w.title}建模记录 · ${site.name}`;

  const steps = (w.steps || []).map((s, i) => `
    <h2 class="section-head"><span class="dot">${i + 1}</span>${esc(s.title)}</h2>
    <p class="body-text">${esc(s.text)}</p>
    ${s.tip ? `<div class="tip"><span class="tip-icon">💡</span><p><strong>小提示：</strong>${esc(s.tip)}</p></div>` : ''}
    ${shots(s.images)}`).join('');

  const logs = (w.logs || []).map(l => `
    <div class="log-item">
      <div class="log-head">
        <span class="log-title">${esc(l.title)}</span>
        ${l.tag ? `<span class="tag">${esc(l.tag)}</span>` : ''}
      </div>
      <p class="body-text">${esc(l.text)}</p>
      ${shots(l.images)}
    </div>`).join('');

  app.innerHTML = `
  <div class="work">
    <a class="back" href="#/">← 返回首页</a>

    <header class="work-head">
      <h1 class="work-title">${esc(w.icon)} ${esc(w.title)}建模记录</h1>
      <p class="work-sub">${esc(site.name)} · ${esc(site.studentId)} · 三维建模作业</p>
    </header>

    <article class="panel">
      ${w.overview ? `<div class="overview"><strong>总体过程：</strong>${esc(w.overview)}</div>` : ''}
      ${steps}
      ${logs ? `<h2 class="sec-emoji">🔧 学习过程与问题记录</h2>${logs}` : ''}
    </article>

    <footer class="footer">${esc(site.footer)}</footer>
  </div>`;
}

/* ---------- 路由 ---------- */
function render(){
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const work = works.find(w => w.id === id);
  work ? renderWork(work) : renderHome();
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);

/* ---------- 点击图片放大 ---------- */
document.addEventListener('click', e => {
  const img = e.target.closest('.shots img');
  if (img){
    lightbox.firstElementChild.src = img.src;
    lightbox.classList.add('open');
  } else if (e.target.closest('#lightbox')){
    lightbox.classList.remove('open');
  }
});

/* ---------- 启动：读取 JSON ---------- */
(async function boot(){
  try{
    const [s, w] = await Promise.all([
      fetch('content/site.json',  { cache: 'no-cache' }).then(r => r.json()),
      fetch('content/works.json', { cache: 'no-cache' }).then(r => r.json())
    ]);
    Object.assign(site, s);
    works = Array.isArray(w) ? w : [];
    render();
  }catch (err){
    app.innerHTML = `
      <div class="error">
        <h2>内容读取失败</h2>
        <p>如果你是直接双击打开 index.html，浏览器会拦截本地 JSON 读取（CORS 限制），这是正常现象。</p>
        <p>请用本地服务器预览：在项目文件夹里执行</p>
        <pre>python -m http.server 8000</pre>
        <p>然后打开 <code>http://localhost:8000</code></p>
        <p class="err-detail">错误信息：${esc(err.message)}</p>
      </div>`;
  }
})();
</script>
</body>
</html>

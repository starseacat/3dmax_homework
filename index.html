<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>柜子&沙发｜作业档案</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f2f2f2; font-family: "Microsoft YaHei", sans-serif; }
        header {
            background: #2c3e50; color: #fff; padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px;
        }
        h1 { font-size: 20px; font-weight: normal; }
        .btn-group { display: flex; gap: 10px; }
        button {
            background: #34495e; color: #fff; border: none;
            padding: 8px 14px; font-size: 14px; border-radius: 4px; cursor: pointer;
        }
        button.active { background: #e67e22; }
        .info-bar {
            padding: 10px 24px; background: #fff; border-bottom: 1px solid #ddd;
            font-size: 14px; color: #444; display: flex; flex-wrap: wrap; gap: 18px;
        }
        #view-container { width: 100%; height: 72vh; background: #e9e9e9; position: relative; }
        #loading-tip {
            position: absolute; top: 12px; left: 12px;
            background: rgba(255,255,255,0.85); padding: 6px 10px; border-radius: 4px;
        }
        footer {
            padding: 10px 24px; background: #fff;
            border-top: 1px solid #ddd; font-size: 13px; color: #666;
        }
    </style>
</head>
<body>
<header>
    <h1>柜子&沙发｜作业档案</h1>
    <div class="btn-group">
        <button id="btn-proj">切换正交视图</button>
        <button id="btn-wire">显示布线</button>
    </div>
</header>
<div class="info-bar">
    <span>姓名：孟可欣</span>
    <span>学号：25108012010</span>
    <span>项目：3ds Max建模作业</span>
    <span>模型：cabinet.glb（柜子）、sofa.glb（沙发）</span>
    <span>当前视图：<span id="text-view">透视视图</span></span>
    <span>模式：<span id="text-mode">彩色实体</span></span>
    <span>操作：左键旋转｜滚轮缩放｜右键平移</span>
</div>
<div id="view-container">
    <div id="loading-tip">加载中...</div>
</div>
<footer>档案V1.9｜自动缩放模型；透视/正交切换；布线检查</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const container = document.getElementById("view-container");
const tipDom = document.getElementById("loading-tip");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e8e8);

const perspectiveCamera = new THREE.PerspectiveCamera(60, container.clientWidth/container.clientHeight, 0.1, 5000);
perspectiveCamera.position.set(250, 180, 300);

const frustumSize = 400;
const orthoCamera = new THREE.OrthographicCamera(
    -frustumSize/2, frustumSize/2, frustumSize/2, -frustumSize/2, 0.1, 5000
);
orthoCamera.position.set(250, 180, 300);

let activeCamera = perspectiveCamera;
let useOrtho = false;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(activeCamera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 80, 0);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(300, 400, 250);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
scene.add(new THREE.GridHelper(400, 20, 0xbbbbbb, 0xdddddd));

let cabinet = null;
let sofa = null;
let wireframeOn = false;
const gltfLoader = new THREE.GLTFLoader();

// 自动缩放+居中+放到地面上
function fitModel(model, offsetX) {
    // 计算模型包围盒
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    // 缩放到最大边约160单位
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = 160 / maxDim;
    model.scale.setScalar(scale);
    // 重新计算包围盒
    const box2 = new THREE.Box3().setFromObject(model);
    const center2 = box2.getCenter(new THREE.Vector3());
    // 居中并放到地面
    model.position.x += offsetX - center2.x;
    model.position.z -= center2.z;
    model.position.y -= box2.min.y;
    // 双面渲染
    model.traverse(function(obj) {
        if (obj.isMesh) {
            obj.material.side = THREE.DoubleSide;
        }
    });
}

gltfLoader.load("./cabinet.glb",
    function(gltf) {
        cabinet = gltf.scene;
        fitModel(cabinet, -110);
        scene.add(cabinet);
        tipDom.innerText = "已加载：柜子";
    },
    undefined,
    function(err) {
        tipDom.innerText = "❌ 柜子加载失败 cabinet.glb";
    }
);

gltfLoader.load("./sofa.glb",
    function(gltf) {
        sofa = gltf.scene;
        fitModel(sofa, 110);
        scene.add(sofa);
        tipDom.innerText = "✅ 全部加载完成！柜子+沙发";
    },
    undefined,
    function(err) {
        tipDom.innerText = "❌ 沙发加载失败 sofa.glb";
    }
);

function setWire(enable) {
    function traverseObj(obj) {
        if (!obj) return;
        obj.traverse(child => {
            if (child.isMesh) {
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach(m => { m.wireframe = enable; m.side = THREE.DoubleSide; });
            }
        });
    }
    traverseObj(cabinet);
    traverseObj(sofa);
}

document.getElementById("btn-wire").onclick = function() {
    wireframeOn = !wireframeOn;
    setWire(wireframeOn);
    if (wireframeOn) {
        this.textContent = "隐藏布线"; this.classList.add("active");
        document.getElementById("text-mode").innerText = "线框布线";
    } else {
        this.textContent = "显示布线"; this.classList.remove("active");
        document.getElementById("text-mode").innerText = "彩色实体";
    }
};

document.getElementById("btn-proj").onclick = function() {
    useOrtho = !useOrtho;
    const oldPos = activeCamera.position.clone();
    const oldRot = activeCamera.rotation.clone();
    if (useOrtho) {
        activeCamera = orthoCamera;
        this.textContent = "切换透视视图";
        document.getElementById("text-view").innerText = "正交视图";
    } else {
        activeCamera = perspectiveCamera;
        this.textContent = "切换正交视图";
        document.getElementById("text-view").innerText = "透视视图";
    }
    activeCamera.position.copy(oldPos);
    activeCamera.rotation.copy(oldRot);
    controls.object = activeCamera;
    controls.update();
    onResize();
};

function onResize() {
    const w = container.clientWidth, h = container.clientHeight;
    if (!useOrtho) {
        perspectiveCamera.aspect = w/h;
        perspectiveCamera.updateProjectionMatrix();
    } else {
        const aspect = w/h;
        orthoCamera.left = -frustumSize*aspect/2;
        orthoCamera.right = frustumSize*aspect/2;
        orthoCamera.top = frustumSize/2;
        orthoCamera.bottom = -frustumSize/2;
        orthoCamera.updateProjectionMatrix();
    }
    renderer.setSize(w, h);
}
window.addEventListener("resize", onResize);

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, activeCamera);
}
animate();
</script>
</body>
</html>

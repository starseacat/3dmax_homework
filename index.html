<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>孟可欣 · 三维建模作业</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
*{box-sizing:border-box}

body{
  margin:0;min-height:100vh;color:#e8f0ff;line-height:1.8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 760px at 12% -12%, #1b3c7a 0%, transparent 58%),
    radial-gradient(900px 700px at 92% 4%, #143a72 0%, transparent 55%),
    linear-gradient(180deg,#060f24 0%,#0a1a3d 45%,#07132c 100%);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}

/* ============ 星空 ============ */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#stars span{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}

.moon{
  position:absolute;top:8vh;right:9vw;width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #f2f8ff, #c3d8f7 58%, #8fb3e0 100%);
  box-shadow:0 0 46px 10px rgba(160,200,255,.38), inset -10px -8px 16px rgba(90,130,190,.35);
  opacity:.92;
}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(120,152,196,.35)}
.moon::before{width:14px;height:14px;top:16px;left:20px}
.moon::after{width:9px;height:9px;top:44px;left:48px}

.planet{
  position:absolute;left:5vw;bottom:8vh;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 30% 26%, #8dbaff, #3568cf 55%, #16366f 100%);
  box-shadow:0 0 54px 12px rgba(80,140,255,.22);
  opacity:.55;animation:float 9s ease-in-out infinite;
}
.planet::after{
  content:"";position:absolute;left:-36px;top:36px;width:190px;height:52px;
  border:2px solid rgba(160,200,255,.42);border-radius:50%;transform:rotate(-22deg);
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#app{position:relative;z-index:1}

/* ============ 首页 ============ */
.home{max-width:820px;margin:0 auto;padding:76px 24px 0;text-align:center}
.home-title{
  display:inline-block;margin:0;padding-bottom:14px;
  font-size:29px;font-weight:600;letter-spacing:.04em;color:#dce9ff;
  border-bottom:2px solid rgba(120,170,255,.55);
  text-shadow:0 0 24px rgba(90,150,255,.45);
}
.home-meta{margin:20px 0 0;font-size:13px;letter-spacing:.05em;color:#9db4dd}
.notice-line{
  display:inline-flex;align-items:center;gap:8px;
  margin:22px 0 0;padding:7px 16px;
  font-size:12.5px;letter-spacing:.05em;color:#a8c6f5;
  background:rgba(90,145,255,.10);
  border:1px solid rgba(120,170,255,.22);
  border-radius:999px;
}
.pulse{width:6px;height:6px;border-radius:50%;background:#7fb6ff;animation:pulse 2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(127,182,255,.6)}
  70%{box-shadow:0 0 0 8px rgba(127,182,255,0)}
  100%{box-shadow:0 0 0 0 rgba(127,182,255,0)}
}

/* ============ 星星挂纸条 · 模型说明 ============ */
.note{
  width:100%;max-width:620px;margin:40px auto 0;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.note-star{
  font-size:30px;line-height:1;color:#e4f0ff;
  text-shadow:0 0 16px rgba(160,205,255,.95), 0 0 44px rgba(90,150,255,.6);
  animation:starPulse 3.6s ease-in-out infinite;
}
@keyframes starPulse{
  0%,100%{transform:scale(1) rotate(0deg);opacity:.9}
  50%{transform:scale(1.14) rotate(8deg);opacity:1}
}
.note-thread{
  width:2px;height:28px;
  background:linear-gradient(180deg,rgba(205,228,255,.9),rgba(205,228,255,.12));
}
.note-paper{
  position:relative;width:100%;
  padding:20px 22px 18px;text-align:left;color:#1b2c4a;
  background:linear-gradient(180deg,#fcfdff,#e9f1ff);
  border:1px solid rgba(160,195,240,.85);
  border-radius:10px;
  box-shadow:0 20px 44px rgba(0,10,35,.45), inset 0 0 0 1px rgba(255,255,255,.7);
  transform:rotate(-1.4deg);
}
.note-paper::before{
  content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff,#a3c5ef 60%,#6d95c8);
  box-shadow:0 2px 6px rgba(0,10,35,.45);
}
.note-paper::after{
  content:"";position:absolute;right:0;bottom:0;
  border-width:0 0 16px 16px;border-style:solid;
  border-color:transparent transparent #d3e3fa transparent;
}
.note-paper h2{margin:0 0 10px;font-size:14.5px;font-weight:700;color:#12365e;letter-spacing:.05em}
.note-paper p{margin:0 0 8px;font-size:12.5px;line-height:2;color:#3a5070}
.note-paper p:last-child{margin-bottom:0}
.note-paper b{color:#12365e}

@media (min-width:1420px){
  .note{
    position:fixed;top:120px;right:28px;
    width:252px;max-width:none;margin:0;z-index:5;
  }
  .note-paper{transform:rotate(-2.4deg)}
}

/* ============ 卡片 ============ */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;max-width:640px;margin:44px auto 0}
.card{
  display:block;padding:16px 16px 20px;cursor:pointer;
  background:linear-gradient(180deg, rgba(30,58,116,.78), rgba(14,30,66,.85));
  border:1px solid rgba(125,170,255,.20);
  border-radius:22px;
  box-shadow:0 18px 45px rgba(0,8,30,.45);
  backdrop-filter:blur(8px);
  transition:transform .22s, box-shadow .22s, border-color .22s;
}
.card:hover{transform:translateY(-6px);border-color:rgba(140,190,255,.55);box-shadow:0 24px 60px rgba(40,110,255,.32)}

.card-cover{
  position:relative;height:160px;border-radius:16px;overflow:hidden;
  background:radial-gradient(circle at 50% 58%, rgba(70,125,215,.38), rgba(10,22,50,.25));
  border:1px solid rgba(125,170,255,.14);
}
.card-3d{position:absolute;inset:0}
.card-3d canvas{display:block}
.card-emoji{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:40px;line-height:1;
  filter:drop-shadow(0 0 14px rgba(130,180,255,.5));
  transition:opacity .35s ease;
}
.card-cover.ready .card-emoji{opacity:0}

.card-cover.ready::after{
  content:"点击进入详情页，配图和模型加载需要时间，请耐心等待";
  position:absolute;left:0;right:0;bottom:0;
  padding:16px 12px 7px;
  font-size:10px;line-height:1.5;text-align:center;
  color:rgba(200,222,255,.85);letter-spacing:.03em;
  background:linear-gradient(180deg,rgba(8,18,40,0),rgba(8,18,40,.8));
  pointer-events:none;
}

.card-title{margin:16px 0 0;font-size:21px;font-weight:600;color:#eaf2ff;letter-spacing:.02em}
.card-line{height:1px;background:rgba(140,180,255,.20);margin:16px 0 12px}
.card-desc{margin:0;font-size:12.5px;line-height:1.9;color:#9db4dd;letter-spacing:.02em}

/* 卡片上的视频按钮 */
.card-videos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.v-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:999px;
  font-size:11.5px;letter-spacing:.03em;color:#bcd8ff;
  background:rgba(90,145,255,.14);
  border:1px solid rgba(120,170,255,.28);
  transition:background .2s,color .2s,border-color .2s;
}
.v-chip:hover{background:rgba(110,170,255,.32);color:#ffffff;border-color:rgba(150,200,255,.55)}

/* ============ 持续更新 ============ */
.update-card{
  grid-column:1/-1;padding:20px 26px 18px;text-align:left;
  background:linear-gradient(90deg, rgba(48,92,180,.26), rgba(16,34,74,.30));
  border:1px dashed rgba(125,180,255,.38);border-radius:20px;
}
.update-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.update-icon{font-size:26px;line-height:1;filter:drop-shadow(0 0 14px rgba(120,180,255,.55));animation:float 6s ease-in-out infinite}
.update-text h2{margin:0;font-size:16px;font-weight:600;color:#dce9ff;letter-spacing:.06em}
.update-text p{margin:4px 0 0;font-size:12.5px;color:#96afd6;letter-spacing:.04em}
.update-dots{display:inline-flex;gap:5px;margin-left:auto}
.update-dots i{width:6px;height:6px;border-radius:50%;background:#7fb6ff;animation:dotFade 1.4s ease-in-out infinite}
.update-dots i:nth-child(2){animation-delay:.2s}
.update-dots i:nth-child(3){animation-delay:.4s}
@keyframes dotFade{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.update-bar{height:3px;margin-top:14px;border-radius:2px;overflow:hidden;background:rgba(120,170,255,.12)}
.update-bar span{
  display:block;height:100%;width:35%;
  background:linear-gradient(90deg,transparent,#8fc4ff,transparent);
  animation:slide 2.6s linear infinite;
}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(380%)}}

/* ============ 留言 ============ */
.msg-box{
  max-width:640px;margin:22px auto 0;padding:24px 26px;text-align:left;
  background:linear-gradient(180deg,rgba(24,48,98,.7),rgba(11,25,56,.85));
  border:1px solid rgba(125,170,255,.18);border-radius:20px;
}
.msg-box h2{margin:0 0 6px;font-size:16px;font-weight:600;color:#dce9ff}
.msg-tip{margin:0 0 14px;font-size:12.5px;color:#96afd6}
.mail-btn{
  display:block;padding:12px;text-align:center;
  font-size:14px;font-weight:600;color:#04122c;
  background:linear-gradient(135deg,#5b9bff,#9ad0ff);border-radius:10px;
}

/* ============ 详情页 ============ */
.work{max-width:1000px;margin:0 auto;padding:40px 24px 0}
.back{
  display:inline-block;padding:7px 18px;font-size:13.5px;color:#a9c9ff;
  background:rgba(110,168,255,.14);border:1px solid rgba(120,170,255,.22);border-radius:999px;
}
.back:hover{background:rgba(110,168,255,.26)}
.work-head{text-align:center;margin:34px 0}
.work-title{margin:0 0 10px;font-size:32px;font-weight:700;color:#e8f1ff;text-shadow:0 0 28px rgba(90,150,255,.4)}
.work-sub{margin:0;font-size:14px;color:#9db4dd}
.panel{
  padding:38px 46px 44px;
  background:linear-gradient(180deg, rgba(24,48,98,.80), rgba(11,25,56,.88));
  border:1px solid rgba(125,170,255,.18);border-radius:26px;
  box-shadow:0 24px 60px rgba(0,8,30,.45);backdrop-filter:blur(8px);
}
.overview{
  margin:0 0 34px;padding:18px 22px;font-size:15px;line-height:1.95;color:#cfe0ff;
  background:rgba(80,140,255,.10);border-left:4px solid #6ea8ff;border-radius:10px;
}
.overview strong{color:#a9cbff}

/* 3D 预览 */
.viewer{
  position:relative;margin:0 0 30px;border-radius:18px;overflow:hidden;
  border:1px solid rgba(125,170,255,.18);
  background:radial-gradient(circle at 50% 40%, rgba(40,80,160,.35), rgba(8,20,44,.7));
}
.mv-host{width:100%;height:460px}
.mv-host canvas{display:block}
.mv-err{padding:60px 20px;text-align:center;font-size:13px;color:#ffb3b3}
.mv-bar{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
.mv-bar button{
  padding:6px 13px;font-size:12.5px;color:#cfe0ff;cursor:pointer;
  background:rgba(10,24,52,.78);border:1px solid rgba(125,170,255,.3);border-radius:999px;
}
.mv-bar button:hover{background:rgba(60,110,200,.55)}
.mv-bar button.on{color:#04122c;background:linear-gradient(135deg,#5b9bff,#9ad0ff);border-color:transparent}
.mv-hint{position:absolute;right:14px;bottom:16px;margin:0;font-size:11.5px;color:#8fa8cf;z-index:2}

/* 视频 */
.video-block{margin:0 0 32px}
.video-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.v-tab{
  padding:6px 14px;font-size:12.5px;color:#bcd8ff;cursor:pointer;
  background:rgba(90,145,255,.12);
  border:1px solid rgba(120,170,255,.25);
  border-radius:999px;transition:.2s;
}
.v-tab:hover{background:rgba(110,170,255,.26)}
.v-tab.on{color:#04122c;background:linear-gradient(135deg,#5b9bff,#9ad0ff);border-color:transparent}
.video-frame{
  position:relative;padding-top:56.25%;
  border-radius:14px;overflow:hidden;
  border:1px solid rgba(125,170,255,.2);
  background:#05101f;
}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.section-head{display:flex;align-items:center;gap:10px;margin:36px 0 14px;font-size:19px;font-weight:700;color:#dce9ff}
.dot{
  display:flex;align-items:center;justify-content:center;flex:0 0 26px;
  width:26px;height:26px;font-size:13px;font-weight:600;color:#06132c;
  background:linear-gradient(135deg,#5b9bff,#9ad0ff);border-radius:50%;
  box-shadow:0 0 16px rgba(90,155,255,.5);
}
.body-text{margin:0;font-size:15px;line-height:1.95;color:#c6d6f2}
.tip{
  display:flex;gap:10px;margin:16px 0 0;padding:14px 18px;font-size:14px;color:#b8cdf0;
  background:rgba(120,170,255,.08);border:1px solid rgba(120,170,255,.18);border-radius:12px;
}
.tip p{margin:0;line-height:1.85}
.tip strong{color:#9ad0ff}
.shots{margin-top:18px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.shots img{
  width:100%;display:block;cursor:zoom-in;border:1px solid rgba(140,180,255,.22);
  border-radius:12px;box-shadow:0 10px 28px rgba(0,8,30,.5);
}
.sec-emoji{display:flex;align-items:center;gap:8px;margin:46px 0 18px;font-size:18px;font-weight:700;color:#dce9ff}
.log-item{margin-bottom:16px;padding:22px 24px;background:rgba(16,34,74,.55);border:1px solid rgba(125,170,255,.16);border-radius:16px}
.log-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.log-title{font-size:15px;font-weight:600;color:#e2ecff}
.tag{
  padding:3px 10px;font-size:12px;color:#a9c9ff;
  background:rgba(110,168,255,.16);border:1px solid rgba(120,170,255,.2);border-radius:999px;
}

.footer{
  margin-top:56px;padding:26px 0 40px;text-align:center;font-size:12.5px;
  letter-spacing:.06em;color:#7f96bd;border-top:1px solid rgba(140,180,255,.15);
}
#zoom{
  display:none;position:fixed;inset:0;z-index:99;align-items:center;justify-content:center;
  background:rgba(4,10,24,.94);padding:4vh 4vw;cursor:zoom-out;
}
#zoom.open{display:flex}
#zoom img{max-width:100%;max-height:92vh;border-radius:8px}

@media (max-width:640px){
  .home{padding-top:48px}
  .home-title{font-size:21px}
  .note{margin-top:30px}
  .note-star{font-size:24px}
  .note-paper{padding:16px 16px 14px;transform:rotate(-1deg)}
  .cards{grid-template-columns:1fr;gap:18px;margin-top:30px}
  .card{padding:14px 14px 18px}
  .card-cover{height:184px}
  .work{padding-top:26px}
  .work-title{font-size:24px}
  .panel{padding:24px 18px 30px;border-radius:20px}
  .section-head{font-size:17px}
  .body-text{font-size:14.5px}
  .planet{width:78px;height:78px;opacity:.4}
  .planet::after{left:-22px;top:24px;width:122px;height:34px}
  .moon{width:54px;height:54px;top:5vh;right:8vw}
  .update-card{padding:18px 20px 16px}
  .update-dots{display:none}
  .mv-host{height:320px}
  .mv-hint{display:none}
}
</style>
</head>
<body>

<div class="sky">
  <div id="stars"></div>
  <div class="moon"></div>
  <div class="planet"></div>
</div>

<div id="app"></div>
<div id="zoom"><img alt=""></div>

<script>
/* ================= 1. 个人信息 ================= */
const SITE = {
  name: "孟可欣",
  studentId: "25108012010",
  className: "25级数字媒体技术1班",
  email: "mengmo07@163.com",
  footer: "© 2025 孟可欣 · 25级数字媒体技术1班"
};

/* ================= 2. 作业内容 =================
   videos: label 显示名，bvid 用于内嵌播放
================================================ */
const WORKS = [
  {
    id: "computer-set",
    icon: "🖱️",
    title: "电脑三件套",
    model: "assets/model/computer-set.glb",
    desc: "鼠标分缝 · 键盘挖键 · 显示屏",
    videos: [
      { label: "鼠标",   bvid: "BV1aa411a78v" },
      { label: "键盘",   bvid: "BV1VY4y1k7Qf" },
      { label: "显示器", bvid: "BV1H84y1W7yN" }
    ],
    overview: "电脑三件套按鼠标、键盘、显示屏的顺序完成。鼠标用长方体加切角起形，靠晶格和涡轮平滑做出握感，再处理左右键分缝；键盘按参考图分区，用分段和半透明材质临摹键位，逐层挖空后填满键帽；显示屏为了控制进度做得比较快，用简化的长方体拼出结构，最后贴一块平面并拉高反射做出屏幕。",
    steps: [
      {
        title: "鼠标：上传参考图",
        text: "先找一张鼠标的正视图和侧视图作为参考，重点看长宽比例、背部最高点的位置，以及左右键缝隙的走向。把参考图放进视口对齐之后再动手，比凭感觉做要准得多。",
        tip: "参考图可以设为视口背景（Alt+B），按 F3 / F4 随时切换线框，方便对形。",
        images: []
      },
      {
        title: "长方体加切角修改器",
        text: "鼠标的形体从一个长方体开始。先按参考图的比例调好长、宽、高，再添加「切角（Chamfer）修改器」，把四条垂直边和一个顶面切出圆角，得到一个圆润的楔形，这就是握感的基础。",
        tip: "切角分段先给 2~3 段就够，段数太多后面调形会很卡；不够再往上加。",
        images: []
      },
      {
        title: "晶格与涡轮平滑",
        text: "接着加「晶格（Lattice）修改器」检查整体布线是否均匀，再叠加「涡轮平滑（TurboSmooth）」把表面变圆润。这一步主要看哪里网格挤在一起——线太密的位置，后面很容易鼓包或者破面。",
        tip: "涡轮平滑迭代次数先别超过 2，确认大形没问题再往上加，否则改起来非常卡。",
        images: []
      },
      {
        title: "分出左右键区域",
        text: "进入多边形层级，选择鼠标前部对应的边，先「切角」把这些边分开，形成左右键的分缝；再选中按键区域的面，沿局部法线向里「挤出」一点，做出按键的高度差；最后对新边缘再切一次角，让缝隙有细微的倒角过渡，不至于生硬。",
        tip: "挤出的方向一定选「局部法线」，用「组」方向会把缝隙拉歪。",
        images: []
      },
      {
        title: "修掉破面：翻转法线、移动面、塌陷",
        text: "分缝做完后，缝隙附近出现了几块发黑、朝里的面（第二张截图记录的就是这个状态）。处理办法是：先选中问题面「翻转」法线，再把挤出的面往回移动一点，让它和相邻面对齐；最后用「塌陷」把多余的细分点收掉，面就基本恢复正常了。",
        tip: "判断黑面原因：把视口的「背面消隐」关掉，如果黑面消失，就是法线反了；如果还在黑，是两块面重合。",
        images: []
      },

/* ================= 3. 星空 ================= */
(function stars(){
  const box = document.getElementById('stars');
  for (let i = 0; i < 90; i++){
    const s = document.createElement('span');
    const size = (Math.random() * 2 + 1).toFixed(1);
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.top  = (Math.random() * 100).toFixed(2) + '%';
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    box.appendChild(s);
  }
})();

/* ================= 4. 工具 ================= */
const app  = document.getElementById('app');
const zoom = document.getElementById('zoom');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toArr = v => Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);

const playerSrc = bvid => 'https://player.bilibili.com/player.html?bvid=' + bvid + '&page=1&high_quality=1&danmaku=0&autoplay=0';
const videoHref = bvid => 'https://www.bilibili.com/video/' + bvid;

function shots(v){
  const a = toArr(v);
  if (!a.length) return '';
  return `<div class="shots">${a.map(src => `<img src="${esc(src)}" alt="" loading="lazy">`).join('')}</div>`;
}

function loadImg(src){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}

async function autoLoad(){
  const boxes = document.querySelectorAll('.shots[data-auto]');
  for (const box of boxes){
    const base = box.dataset.auto;
    for (let i = 1; i <= 6; i++){
      const src = base + (i === 1 ? '.jpg' : '-' + i + '.jpg');
      const im = await loadImg(src);
      if (!im) break;
      box.appendChild(im);
    }
  }
}

/* ================= 7. 路由 ================= */
function render(){
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const w = WORKS.find(x => x.id === id);
  w ? renderWork(w) : renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ================= 8. 交互 ================= */
document.addEventListener('click', e => {

  /* 卡片点击进入详情（视频按钮除外） */
  const card = e.target.closest('.card[data-href]');
  if (card && !e.target.closest('.v-chip')){
    location.hash = card.dataset.href;
    return;
  }

  /* 图片放大 */
  const img = e.target.closest('.shots img');
  if (img){
    zoom.firstElementChild.src = img.src;
    zoom.classList.add('open');
    return;
  }
  if (e.target.closest('#zoom')){
    zoom.classList.remove('open');
    return;
  }

  /* 视频切换 */
  const tab = e.target.closest('.v-tab');
  if (tab){
    const block = tab.closest('.video-block');
    block.querySelectorAll('.v-tab').forEach(t => t.classList.toggle('on', t === tab));
    const iframe = block.querySelector('iframe');
    if (iframe) iframe.src = tab.dataset.src;
    return;
  }

  /* 3D 工具栏 */
  const b = e.target.closest('[data-mv]');
  if (!b) return;

  if (b.dataset.mv === 'rotate'){
    const on = window.mvRotate ? window.mvRotate() : false;
    b.textContent = on ? '暂停旋转' : '开始旋转';
  }

  if (b.dataset.mv === 'wire'){
    const on = window.mvWire ? window.mvWire() : false;
    b.classList.toggle('on', !!on);
  }

  if (b.dataset.mv === 'reset'){
    if (window.mvReset) window.mvReset();
  }
});

render();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const loader = new GLTFLoader();

let renderer = null, scene = null, camera = null, controls = null;
let model = null, host = null, raf = 0;

let edgeLines = [], meshMats = [], edgeOn = false;

function triCount(geo){
  if (!geo) return 0;
  if (geo.index) return geo.index.count / 3;
  return geo.attributes.position ? geo.attributes.position.count / 3 : 0;
}

function disposeAll(){
  if (raf){ cancelAnimationFrame(raf); raf = 0; }
  if (renderer){
    renderer.dispose();
    if (renderer.domElement && renderer.domElement.parentNode){
      renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
    renderer = null;
  }
  edgeLines.forEach(l => { if (l.geometry) l.geometry.dispose(); });
  model = null; controls = null;
  edgeLines = []; meshMats = [];
}

function frameModel(){
  if (!model) return;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()).length() || 1;
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);

  camera.near = size / 200;
  camera.far  = size * 50;
  camera.updateProjectionMatrix();
  camera.position.set(size * 0.75, size * 0.55, size * 1.0);
  controls.target.set(0, 0, 0);
  controls.update();
}

function buildEdges(root){
  edgeLines = [];
  meshMats  = [];

  const meshes = [];
  root.traverse(o => { if (o.isMesh && o.geometry) meshes.push(o); });

  const matSoft = new THREE.LineBasicMaterial({
    color: 0x8fc0ff, transparent: true, opacity: 0.22, depthWrite: false
  });
  const matHard = new THREE.LineBasicMaterial({
    color: 0xd6ecff, transparent: true, opacity: 0.9, depthWrite: false
  });

  let budget = 460000;

  meshes.forEach(mesh => {
    (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).forEach(m => {
      if (!m || !m.userData) return;
      if (!m.userData.__saved){
        m.userData.__saved = { opacity: m.opacity, transparent: m.transparent, depthWrite: m.depthWrite };
      }
      meshMats.push(m);
    });

    const tris = triCount(mesh.geometry);

    if (tris <= 90000 && budget > 0){
      const wf = new THREE.WireframeGeometry(mesh.geometry);
      const cnt = wf.attributes.position ? wf.attributes.position.count / 2 : 0;
      if (cnt && cnt <= budget){
        budget -= cnt;
        const ls = new THREE.LineSegments(wf, matSoft);
        ls.visible = false;
        ls.renderOrder = 1;
        mesh.add(ls);
        edgeLines.push(ls);
      } else {
        wf.dispose();
      }
    }

    const eg = new THREE.EdgesGeometry(mesh.geometry, 12);
    const cnt2 = eg.attributes.position ? eg.attributes.position.count / 2 : 0;
    if (cnt2 && cnt2 <= budget){
      budget -= cnt2;
      const lh = new THREE.LineSegments(eg, matHard);
      lh.visible = false;
      lh.renderOrder = 2;
      mesh.add(lh);
      edgeLines.push(lh);
    } else {
      eg.dispose();
    }
  });
}

function init(url){
  host = document.getElementById('mv');
  if (!host || !url) return;

  disposeAll();
  host.innerHTML = '';

  const W = host.clientWidth  || 800;
  const H = host.clientHeight || 460;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  host.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x33406b, 2.2));
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(3, 5, 4);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 1.0);
  fill.position.set(-4, 2, -3);
  scene.add(fill);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;

  loader.load(url, gltf => {
    model = gltf.scene;
    scene.add(model);
    buildEdges(model);
    frameModel();
  }, undefined, err => {
    host.innerHTML = '<div class="mv-err">模型加载失败：' +
      ((err && err.message) ? err.message : '检查 assets/model/ 里的文件名') + '</div>';
  });

  const animate = () => {
    raf = requestAnimationFrame(animate);
    if (!host || !document.body.contains(host)){ cancelAnimationFrame(raf); raf = 0; return; }
    if (controls) controls.update();
    if (renderer && scene && camera) renderer.render(scene, camera);
  };
  animate();

  window.addEventListener('resize', () => {
    if (!renderer || !host) return;
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
}

window.loadViewer = init;

window.mvRotate = () => {
  if (!controls) return false;
  controls.autoRotate = !controls.autoRotate;
  return controls.autoRotate;
};

window.mvWire = () => {
  if (!model) return false;
  edgeOn = !edgeOn;

  edgeLines.forEach(l => { l.visible = edgeOn; });

  meshMats.forEach(m => {
    const s = m.userData && m.userData.__saved;
    if (!s) return;
    if (edgeOn){
      m.transparent = true;
      m.opacity     = 0.07;
      m.depthWrite  = false;
    } else {
      m.transparent = s.transparent;
      m.opacity     = s.opacity;
      m.depthWrite  = s.depthWrite;
    }
    m.needsUpdate = true;
  });

  return edgeOn;
};

window.mvReset = () => {
  if (!model || !camera || !controls) return;
  frameModel();
};

/* ===== 首页卡片小模型 ===== */
const cardViews = [];
let cardsLoop = false;

function disposeLostCards(){
  for (let i = cardViews.length - 1; i >= 0; i--){
    if (!document.body.contains(cardViews[i].host)){
      try { cardViews[i].renderer.dispose(); } catch(e){}
      cardViews.splice(i, 1);
    }
  }
}

function createCard(hostEl){
  const url = hostEl.dataset.src;
  if (!url) return;

  const cover = hostEl.closest('.card-cover');
  const W = hostEl.clientWidth  || 220;
  const H = hostEl.clientHeight || 150;

  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  r.setSize(W, H);
  hostEl.appendChild(r.domElement);

  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(40, W / H, 0.01, 1000);

  s.add(new THREE.HemisphereLight(0xffffff, 0x33406b, 2.4));
  const l1 = new THREE.DirectionalLight(0xffffff, 2.2); l1.position.set(3, 5, 4); s.add(l1);
  const l2 = new THREE.DirectionalLight(0xffffff, 1.0); l2.position.set(-4, 2, -3); s.add(l2);

  const group = new THREE.Group();
  s.add(group);

  loader.load(url, gltf => {
    const m = gltf.scene;
    const box = new THREE.Box3().setFromObject(m);
    const size = box.getSize(new THREE.Vector3()).length() || 1;
    const center = box.getCenter(new THREE.Vector3());
    m.position.sub(center);
    group.add(m);

    c.position.set(size * 0.85, size * 0.55, size * 1.15);
    c.lookAt(0, 0, 0);

    if (cover) cover.classList.add('ready');
  }, undefined, () => {
    if (cover) cover.classList.remove('ready');
  });

  cardViews.push({ host: hostEl, renderer: r, scene: s, camera: c, group });
}

function animateCards(){
  requestAnimationFrame(animateCards);
  for (const v of cardViews){
    if (!document.body.contains(v.host)) continue;
    v.group.rotation.y += 0.0045;
    v.renderer.render(v.scene, v.camera);
  }
}

function initCards(){
  disposeLostCards();

  document.querySelectorAll('.card-3d[data-src]').forEach(el => {
    if (el.dataset.init === '1') return;
    if (!el.dataset.src) return;
    el.dataset.init = '1';
    createCard(el);
  });

  if (!cardsLoop && cardViews.length){ cardsLoop = true; animateCards(); }
}

window.initCards = initCards;

window.addEventListener('resize', () => {
  cardViews.forEach(v => {
    const w = v.host.clientWidth, h = v.host.clientHeight;
    if (!w || !h) return;
    v.camera.aspect = w / h;
    v.camera.updateProjectionMatrix();
    v.renderer.setSize(w, h);
  });
});

if (window.__modelUrl) init(window.__modelUrl);
initCards();
</script>
</body>
</html>
